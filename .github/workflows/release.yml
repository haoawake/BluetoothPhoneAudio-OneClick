name: Release AudioBridge

on:
  push:
    tags:
      - 'v*'
    branches: [main]
    paths:
      - '.github/release-request.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/win/AudioBridge | Out-Null
          Copy-Item windows/* dist/win/AudioBridge -Recurse
          Copy-Item README.zh-CN.md dist/win/AudioBridge/README.md
          Copy-Item THIRD_PARTY_NOTICES.md dist/win/AudioBridge/
          Compress-Archive -Path dist/win/AudioBridge -DestinationPath dist/AudioBridge-win.zip -CompressionLevel Optimal
          $hash=(Get-FileHash dist/AudioBridge-win.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  AudioBridge-win.zip" | Set-Content dist/SHA256-Windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            dist/AudioBridge-win.zip
            dist/SHA256-Windows.txt

  mac-package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build macOS app
        run: ./macos/build_app.sh
      - name: SHA-256
        run: shasum -a 256 dist/AudioBridge-mac-universal.zip > dist/SHA256-macOS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mac-package
          path: |
            dist/AudioBridge-mac-universal.zip
            dist/SHA256-macOS.txt

  release:
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    needs: [windows-package, mac-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble checksums
        run: |
          mkdir -p dist
          cp artifacts/windows-package/AudioBridge-win.zip dist/
          cp artifacts/mac-package/AudioBridge-mac-universal.zip dist/
          cat artifacts/windows-package/SHA256-Windows.txt artifacts/mac-package/SHA256-macOS.txt > dist/SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$(tr -d '[:space:]' < .github/release-request.txt)"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/AudioBridge-win.zip dist/AudioBridge-mac-universal.zip dist/SHA256SUMS.txt --clobber
          else
            gh release create "$tag" dist/AudioBridge-win.zip dist/AudioBridge-mac-universal.zip dist/SHA256SUMS.txt --target "$GITHUB_SHA" \
              --title "AudioBridge $tag" \
              --notes "Windows: Bluetooth A2DP Sink launcher. macOS: AirPlay Receiver assistant (iPhone/iPad, not Bluetooth A2DP). See README.zh-CN.md for platform limitations."
          fi
